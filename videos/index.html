<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DPMHZX - 视频流</title>
    <style>
        :root {
            --bg: #000000;
            --surface: #0d0d0d;
            --text: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --accent: #ff4d6a;
            --accent-glow: rgba(255, 77, 106, 0.3);
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-sans);
            color: var(--text);
            touch-action: manipulation;
            -webkit-overflow-scrolling: touch;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            overflow: hidden;
            background: var(--bg);
            box-shadow: var(--shadow-lg);
        }

        @media (min-width: 769px) {
            .app-container {
                border-radius: var(--radius-lg);
                margin-top: 20px;
                margin-bottom: 20px;
                height: calc(100% - 40px);
                max-height: 900px;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0a0a0a;
            }
        }

        .top-nav {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: env(safe-area-inset-top, 12px) 16px 8px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 30%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            align-items: flex-end;
            gap: 6px;
            pointer-events: none;
        }

        .top-nav>* {
            pointer-events: auto;
        }

        .tab-scroll {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 6px 2px;
            flex: 1;
            scroll-behavior: smooth;
        }
        .tab-scroll::-webkit-scrollbar {
            display: none;
        }

        .tab-pill {
            flex-shrink: 0;
            padding: 9px 18px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            white-space: nowrap;
            background: var(--glass);
            color: var(--text-secondary);
            border: 1px solid transparent;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
        }
        .tab-pill:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .tab-pill.active {
            background: #fff;
            color: #000;
            font-weight: 600;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
        }
        .tab-pill .count-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            margin-left: 6px;
            vertical-align: middle;
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        .tab-pill.active .count-dot {
            opacity: 1;
            background: #000;
        }

        .video-scroll-container {
            position: absolute;
            inset: 0;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .video-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .video-panel {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-panel video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .video-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
            transition: opacity 0.4s ease;
        }
        .video-loader.hidden {
            opacity: 0;
        }
        .loader-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .play-overlay.visible { opacity: 1; }
        .play-overlay.hidden { opacity: 0; }
        .play-icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .play-icon-circle svg {
            width: 30px;
            height: 30px;
            fill: #fff;
            margin-left: 4px;
        }

        /* 视频错误提示 */
        .video-error-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 8;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 14px;
            gap: 8px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-error-overlay.show {
            opacity: 1;
        }
        .video-error-overlay span {
            font-size: 32px;
        }
        .video-error-overlay button {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: 0.2s;
        }
        .video-error-overlay button:hover {
            background: rgba(255,255,255,0.25);
        }

        .action-bar {
            position: absolute;
            right: 12px;
            bottom: 160px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            pointer-events: none;
        }
        .action-bar>* { pointer-events: auto; }

        .action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform var(--transition-fast);
            position: relative;
        }
        .action-btn:active { transform: scale(0.9); }
        .action-btn .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-smooth);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .action-btn .icon-circle svg {
            width: 22px;
            height: 22px;
            fill: #fff;
            transition: all var(--transition-smooth);
        }
        .action-btn .action-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.2px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }
        .action-btn.liked .icon-circle {
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent-glow);
            animation: heartBeat 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .action-btn.liked .icon-circle svg { fill: #fff; }
        .action-btn.liked .action-label { color: var(--accent); }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .float-heart {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            animation: floatUp 1.2s ease-out forwards;
            font-size: 28px;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            40% { opacity: 1; transform: translateY(-60px) scale(1.2) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-140px) scale(0.7) rotate(-15deg); }
        }

        .video-info-bar {
            position: absolute;
            left: 16px;
            right: 90px;
            bottom: 40px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .video-info-bar>* { pointer-events: auto; }
        .video-username {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-username .verified-badge {
            display: inline-flex;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .video-description {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            cursor: pointer;
        }
        .video-description.expanded { -webkit-line-clamp: unset; }
        .video-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .video-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }
        .video-tag:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .progress-bar-track {
            position: absolute;
            bottom: 4px;
            left: 8px;
            right: 8px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            z-index: 10;
            overflow: hidden;
            pointer-events: none;
        }
        .progress-bar-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            transition: width 0.15s linear;
            width: 0%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }

        /* 状态覆盖层 */
        .state-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: var(--bg);
            gap: 16px;
            transition: opacity 0.4s ease;
            pointer-events: all;
        }
        .state-overlay.hidden { opacity: 0; pointer-events: none; }
        .state-icon { font-size: 56px; animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        .state-title { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
        .state-subtitle { font-size: 13px; color: var(--text-tertiary); text-align: center; max-width: 280px; line-height: 1.6; }
        .state-btn {
            padding: 12px 28px;
            border-radius: var(--radius-full);
            background: #fff;
            color: #000;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            letter-spacing: 0.4px;
            transition: all var(--transition-smooth);
            font-family: var(--font-sans);
        }
        .state-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,255,255,0.2); }
        .state-btn:active { transform: scale(0.95); }

        @media (max-width: 380px) {
            .action-btn .icon-circle { width: 42px; height: 42px; }
            .action-btn .icon-circle svg { width: 19px; height: 19px; }
            .action-btn .action-label { font-size: 11px; }
            .action-bar { right: 8px; bottom: 140px; gap: 18px; }
            .video-info-bar { left: 12px; right: 75px; bottom: 32px; }
            .tab-pill { padding: 7px 14px; font-size: 13px; }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            .action-bar { right: 20px; bottom: 180px; }
            .video-info-bar { left: 20px; right: 100px; bottom: 50px; }
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <nav class="top-nav" id="topNav">
        <div class="tab-scroll" id="tabScroll"></div>
    </nav>

    <div class="video-scroll-container" id="videoScrollContainer"></div>

    <!-- 加载状态 -->
    <div class="state-overlay" id="loadingOverlay">
        <div class="state-icon">🎬</div>
        <div class="state-title">正在加载视频列表</div>
        <div class="state-subtitle">从 GitHub 仓库获取视频中...</div>
        <div class="loader-spinner" style="margin-top:8px;"></div>
    </div>

    <!-- 错误状态 -->
    <div class="state-overlay hidden" id="errorOverlay">
        <div class="state-icon">😿</div>
        <div class="state-title">加载失败</div>
        <div class="state-subtitle" id="errorMessage">无法获取视频列表，请检查网络或仓库设置。</div>
        <button class="state-btn" id="retryBtn">重新加载</button>
    </div>

    <!-- 空状态 -->
    <div class="state-overlay hidden" id="emptyOverlay">
        <div class="state-icon">📭</div>
        <div class="state-title">暂无视频</div>
        <div class="state-subtitle">Video 目录中还没有视频文件，请上传视频后刷新。</div>
        <button class="state-btn" id="refreshBtn">刷新</button>
    </div>
</div>

<script>
    (function() {
        // ==================== 配置 ====================
        const CONFIG = {
            username: 'spacedls',
            repo: 'dpmhzx',
            branch: 'main',
            videoDir: 'videos',
            apiBase: 'https://api.github.com',
            rawBase: 'https://raw.githubusercontent.com',
            cacheTTL: 30 * 60 * 1000,
            videoExtensions: ['.mp4', '.webm', '.mov', '.avi', '.mkv', '.m4v', '.ogg', '.ogv', '.ts', '.mts', '.m2ts'],
        };

        const appContainer = document.getElementById('appContainer');
        const tabScroll = document.getElementById('tabScroll');
        const videoScrollContainer = document.getElementById('videoScrollContainer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const emptyOverlay = document.getElementById('emptyOverlay');
        const refreshBtn = document.getElementById('refreshBtn');

        let allVideos = [];
        let categories = [];
        let activeCategory = '全部';
        let filteredVideos = [];
        let currentVideoIndex = 0;
        let isMuted = false;   // ✅ 默认开启声音
        let videoElements = [];
        let observer = null;
        let scrollTimeout = null;
        let isScrolling = false;
        let likedVideos = {};

        // ==================== 工具函数 ====================
        function isVideoFile(name) {
            const lower = name.toLowerCase();
            return CONFIG.videoExtensions.some(ext => lower.endsWith(ext));
        }
        function getVideoNameWithoutExt(name) {
            const lastDot = name.lastIndexOf('.');
            return lastDot > 0 ? name.substring(0, lastDot) : name;
        }
        function formatVideoTitle(name) {
            let title = getVideoNameWithoutExt(name);
            title = title.replace(/[-_]+/g, ' ').trim();
            if (title.length > 40) title = title.substring(0, 37) + '...';
            return title || '未命名视频';
        }
        function generatePseudoLikes(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 5) - hash) + name.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash) % 9500 + 50;
        }
        function generatePseudoComments(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 3) - hash) + name.charCodeAt(i) * (i + 1);
                hash |= 0;
            }
            return Math.abs(hash) % 800 + 3;
        }

        // ==================== 缓存管理 ====================
        function getCacheKey() {
            return `dpmhzx_video_cache_${CONFIG.username}_${CONFIG.repo}_${CONFIG.videoDir}`;
        }
        function getCachedData() {
            try {
                const raw = sessionStorage.getItem(getCacheKey());
                if (!raw) return null;
                const data = JSON.parse(raw);
                if (Date.now() - data.timestamp > CONFIG.cacheTTL) {
                    sessionStorage.removeItem(getCacheKey());
                    return null;
                }
                return data;
            } catch (e) { return null; }
        }
        function setCachedData(data) {
            try {
                sessionStorage.setItem(getCacheKey(), JSON.stringify({
                    timestamp: Date.now(),
                    videos: data.videos,
                    categories: data.categories,
                }));
            } catch (e) {}
        }
        function getLikedFromStorage() {
            try { return JSON.parse(localStorage.getItem('dpmhzx_liked_videos')) || {}; } catch (e) { return {}; }
        }
        function saveLikedToStorage() {
            try { localStorage.setItem('dpmhzx_liked_videos', JSON.stringify(likedVideos)); } catch (e) {}
        }

        // ==================== API 请求 ====================
        async function fetchDirectoryContents(path) {
            const url = `${CONFIG.apiBase}/repos/${CONFIG.username}/${CONFIG.repo}/contents/${path}?ref=${CONFIG.branch}`;
            const response = await fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
            if (!response.ok) {
                if (response.status === 403) throw new Error('API 速率限制，请稍后再试');
                if (response.status === 404) throw new Error(`目录不存在: ${path}`);
                throw new Error(`请求失败 (${response.status})`);
            }
            return response.json();
        }

        async function loadAllVideos() {
            const cached = getCachedData();
            if (cached && cached.videos && cached.videos.length > 0) {
                allVideos = cached.videos;
                categories = cached.categories;
                return;
            }

            const contents = await fetchDirectoryContents(CONFIG.videoDir);
            if (!Array.isArray(contents) || contents.length === 0) {
                allVideos = [];
                categories = ['全部'];
                return;
            }

            const videos = [];
            const categorySet = new Set();
            const subDirPromises = [];

            for (const item of contents) {
                if (item.type === 'file' && isVideoFile(item.name)) {
                    videos.push({
                        name: item.name,
                        path: item.path,
                        download_url: item.download_url,
                        category: '推荐',
                        size: item.size || 0,
                    });
                    categorySet.add('推荐');
                } else if (item.type === 'dir') {
                    const dirName = item.name;
                    categorySet.add(dirName);
                    subDirPromises.push(
                        fetchDirectoryContents(item.path)
                        .then(subContents => {
                            if (Array.isArray(subContents)) {
                                for (const subItem of subContents) {
                                    if (subItem.type === 'file' && isVideoFile(subItem.name)) {
                                        videos.push({
                                            name: subItem.name,
                                            path: subItem.path,
                                            download_url: subItem.download_url,
                                            category: dirName,
                                            size: subItem.size || 0,
                                        });
                                    }
                                }
                            }
                        })
                        .catch(err => console.warn(`无法加载子目录 "${dirName}":`, err.message))
                    );
                }
            }

            await Promise.allSettled(subDirPromises);
            allVideos = videos;
            categories = ['全部', ...Array.from(categorySet).sort()];
            if (allVideos.length > 0) {
                setCachedData({ videos: allVideos, categories });
            }
        }

        // ==================== UI 渲染 ====================
        function renderTabs() {
            tabScroll.innerHTML = '';
            categories.forEach(cat => {
                const pill = document.createElement('span');
                pill.className = 'tab-pill' + (cat === activeCategory ? ' active' : '');
                pill.textContent = cat;
                pill.innerHTML += '<span class="count-dot"></span>';
                pill.addEventListener('click', () => switchCategory(cat));
                tabScroll.appendChild(pill);
            });
            requestAnimationFrame(() => {
                const activePill = tabScroll.querySelector('.tab-pill.active');
                if (activePill) activePill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
        }

        function filterVideosByCategory() {
            if (activeCategory === '全部') filteredVideos = [...allVideos];
            else filteredVideos = allVideos.filter(v => v.category === activeCategory);
            currentVideoIndex = 0;
        }

        function renderVideoList() {
            filterVideosByCategory();
            videoScrollContainer.innerHTML = '';
            videoElements = [];

            if (filteredVideos.length === 0) {
                showEmptyState();
                return;
            }

            hideAllOverlays();

            filteredVideos.forEach((video, index) => {
                const panel = createVideoPanel(video, index);
                videoScrollContainer.appendChild(panel);
            });

            videoElements = Array.from(videoScrollContainer.querySelectorAll('.video-panel video'));
            setupIntersectionObserver();
            videoScrollContainer.scrollTop = 0;
            currentVideoIndex = 0;
            setTimeout(() => playVideoAtIndex(0), 300);
        }

        function createVideoPanel(video, index) {
            const panel = document.createElement('div');
            panel.className = 'video-panel';
            panel.setAttribute('data-index', index);
            panel.setAttribute('data-video-name', video.name);

            const videoEl = document.createElement('video');
            videoEl.src = video.download_url;
            videoEl.setAttribute('playsinline', '');
            videoEl.setAttribute('webkit-playsinline', '');
            videoEl.setAttribute('loop', '');
            videoEl.setAttribute('preload', index <= 2 ? 'auto' : 'metadata');
            videoEl.muted = isMuted;
            videoEl.setAttribute('x-webkit-airplay', 'allow');
            videoEl.style.cssText = 'width:100%;height:100%;object-fit:cover;';

            const loader = document.createElement('div');
            loader.className = 'video-loader';
            loader.innerHTML = '<div class="loader-spinner"></div>';

            const playOverlay = document.createElement('div');
            playOverlay.className = 'play-overlay hidden';
            playOverlay.innerHTML = `<div class="play-icon-circle"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>`;

            // 视频错误覆盖层
            const errorOverlay = document.createElement('div');
            errorOverlay.className = 'video-error-overlay';
            errorOverlay.innerHTML = `<span>⚠️</span><p>视频暂时无法播放</p><button class="retry-video-btn">重试</button>`;
            const retryBtn = errorOverlay.querySelector('.retry-video-btn');
            retryBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                errorOverlay.classList.remove('show');
                loader.classList.remove('hidden');
                videoEl.load();
                videoEl.play().catch(() => {});
            });

            const actionBar = document.createElement('div');
            actionBar.className = 'action-bar';
            const likeCount = generatePseudoLikes(video.name);
            const commentCount = generatePseudoComments(video.name);
            const isLiked = !!likedVideos[video.name];
            actionBar.innerHTML = `
                <div class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-video-name="${video.name}">
                    <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
                    <span class="action-label">${formatCount(likeCount)}</span>
                </div>
                <div class="action-btn comment-btn">
                    <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
                    <span class="action-label">${formatCount(commentCount)}</span>
                </div>
                <div class="action-btn share-btn">
                    <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg></div>
                    <span class="action-label">分享</span>
                </div>
                <div class="action-btn save-btn" data-video-name="${video.name}">
                    <div class="icon-circle"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
                    <span class="action-label">收藏</span>
                </div>`;

            const infoBar = document.createElement('div');
            infoBar.className = 'video-info-bar';
            const videoTitle = formatVideoTitle(video.name);
            infoBar.innerHTML = `
                <div class="video-username">@${CONFIG.username}<span class="verified-badge">✓</span></div>
                <div class="video-description" title="点击展开">${escapeHtml(videoTitle)}</div>
                <div class="video-tags">
                    <span class="video-tag">#${escapeHtml(video.category)}</span>
                    <span class="video-tag">#DPMHZX</span>
                </div>`;

            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar-track';
            progressBar.innerHTML = '<div class="progress-bar-fill"></div>';

            panel.appendChild(videoEl);
            panel.appendChild(loader);
            panel.appendChild(playOverlay);
            panel.appendChild(errorOverlay);
            panel.appendChild(actionBar);
            panel.appendChild(infoBar);
            panel.appendChild(progressBar);

            // --- 视频事件 ---
            videoEl.addEventListener('loadeddata', () => {
                loader.classList.add('hidden');
                errorOverlay.classList.remove('show');
            });
            videoEl.addEventListener('waiting', () => loader.classList.remove('hidden'));
            videoEl.addEventListener('playing', () => {
                loader.classList.add('hidden');
                playOverlay.classList.add('hidden');
                playOverlay.classList.remove('visible');
                errorOverlay.classList.remove('show');
            });
            videoEl.addEventListener('pause', () => {
                if (videoEl.readyState >= 2) {
                    playOverlay.classList.add('visible');
                    playOverlay.classList.remove('hidden');
                }
            });
            videoEl.addEventListener('ended', () => {
                const fill = panel.querySelector('.progress-bar-fill');
                if (fill) fill.style.width = '0%';
            });
            videoEl.addEventListener('timeupdate', () => {
                if (videoEl.duration && isFinite(videoEl.duration)) {
                    const pct = (videoEl.currentTime / videoEl.duration) * 100;
                    const fill = panel.querySelector('.progress-bar-fill');
                    if (fill) fill.style.width = pct + '%';
                }
            });
            videoEl.addEventListener('error', () => {
                loader.classList.add('hidden');
                errorOverlay.classList.add('show');
                console.warn('视频加载失败:', video.name);
            });

            // 点击切换播放/暂停
            videoEl.addEventListener('click', (e) => {
                e.stopPropagation();
                togglePlayPause(videoEl, playOverlay);
            });
            panel.addEventListener('click', (e) => {
                if (!e.target.closest('.action-btn') && !e.target.closest('.video-tag') && !e.target.closest('.video-description') && !e.target.closest('.video-error-overlay')) {
                    togglePlayPause(videoEl, playOverlay);
                }
            });

            // 双击点赞
            panel.addEventListener('dblclick', (e) => {
                if (e.target.closest('.action-btn') || e.target.closest('.video-error-overlay')) return;
                triggerLike(panel, video);
            });

            // 点赞按钮
            const likeBtn = actionBar.querySelector('.like-btn');
            likeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                triggerLike(panel, video, likeBtn);
            });

            // 评论
            actionBar.querySelector('.comment-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                showToast('💬 评论功能即将上线');
            });

            // 分享
            actionBar.querySelector('.share-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                copyShareLink(video);
            });

            // 收藏
            actionBar.querySelector('.save-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                const iconCircle = actionBar.querySelector('.save-btn .icon-circle');
                iconCircle.style.background = 'rgba(255,215,0,0.7)';
                iconCircle.style.borderColor = 'rgba(255,215,0,0.9)';
                setTimeout(() => { iconCircle.style.background = ''; iconCircle.style.borderColor = ''; }, 600);
                showToast('⭐ 已收藏');
            });

            // 描述展开
            const descEl = infoBar.querySelector('.video-description');
            descEl.addEventListener('click', (e) => {
                e.stopPropagation();
                descEl.classList.toggle('expanded');
            });

            // 标签点击
            infoBar.querySelectorAll('.video-tag').forEach(tag => {
                tag.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tagText = tag.textContent.replace('#', '').trim();
                    if (categories.includes(tagText)) switchCategory(tagText);
                });
            });

            return panel;
        }

        function togglePlayPause(videoEl, playOverlay) {
            if (videoEl.paused) {
                videoEl.play().catch(() => {});
                playOverlay.classList.add('hidden');
                playOverlay.classList.remove('visible');
            } else {
                videoEl.pause();
                playOverlay.classList.add('visible');
                playOverlay.classList.remove('hidden');
            }
        }

        function triggerLike(panel, video, likeBtnEl) {
            const likeBtn = likeBtnEl || panel.querySelector('.like-btn');
            const wasLiked = likeBtn.classList.contains('liked');
            if (!wasLiked) {
                likeBtn.classList.add('liked');
                likedVideos[video.name] = true;
                const label = likeBtn.querySelector('.action-label');
                label.textContent = formatCount(generatePseudoLikes(video.name) + 1);
                spawnFloatingHeart(panel, likeBtn);
            } else {
                likeBtn.classList.remove('liked');
                delete likedVideos[video.name];
                const label = likeBtn.querySelector('.action-label');
                label.textContent = formatCount(generatePseudoLikes(video.name));
            }
            saveLikedToStorage();
        }

        function spawnFloatingHeart(panel, likeBtn) {
            const heart = document.createElement('span');
            heart.className = 'float-heart';
            heart.textContent = '❤️';
            const btnRect = likeBtn.getBoundingClientRect();
            const panelRect = panel.getBoundingClientRect();
            heart.style.left = (btnRect.left - panelRect.left + btnRect.width/2 - 14) + 'px';
            heart.style.top = (btnRect.top - panelRect.top) + 'px';
            panel.appendChild(heart);
            heart.addEventListener('animationend', () => heart.remove());
        }

        function copyShareLink(video) {
            const shareUrl = `${CONFIG.rawBase}/${CONFIG.username}/${CONFIG.repo}/${CONFIG.branch}/${video.path}`;
            if (navigator.clipboard?.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => showToast('📋 视频链接已复制')).catch(() => fallbackCopy(shareUrl));
            } else fallbackCopy(shareUrl);
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try { document.execCommand('copy'); showToast('📋 视频链接已复制'); } catch (e) { showToast('⚠️ 复制失败，请手动复制'); }
            document.body.removeChild(ta);
        }

        function showToast(message) {
            let toast = document.querySelector('.global-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'global-toast';
                toast.style.cssText = `
                    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
                    background: rgba(0,0,0,0.85); color: #fff; padding: 10px 22px;
                    border-radius: 24px; font-size: 13px; z-index: 999;
                    pointer-events: none; transition: all 0.35s ease;
                    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
                    border: 1px solid rgba(255,255,255,0.2);
                    opacity: 0; letter-spacing: 0.3px;
                `;
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
            }, 1800);
        }

        function formatCount(num) {
            if (num >= 10000) return (num/10000).toFixed(1)+'w';
            if (num >= 1000) return (num/1000).toFixed(1)+'k';
            return num.toString();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== Observer ====================
        function setupIntersectionObserver() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const panel = entry.target;
                    const videoEl = panel.querySelector('video');
                    const index = parseInt(panel.getAttribute('data-index'));
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.65) {
                        if (currentVideoIndex !== index) {
                            pauseAllVideosExcept(index);
                            currentVideoIndex = index;
                        }
                        if (videoEl && videoEl.paused) {
                            videoEl.play().catch(() => {
                                // 自动播放被阻止，显示播放按钮（不自动静音，保留用户主动开启声音的机会）
                                const overlay = panel.querySelector('.play-overlay');
                                if (overlay) {
                                    overlay.classList.add('visible');
                                    overlay.classList.remove('hidden');
                                }
                            });
                        }
                        preloadAdjacentVideos(index);
                    } else if (entry.intersectionRatio < 0.3) {
                        if (videoEl && !videoEl.paused && currentVideoIndex !== index) {
                            videoEl.pause();
                        }
                    }
                });
            }, { root: videoScrollContainer, rootMargin: '0px', threshold: 0.65 });

            videoScrollContainer.querySelectorAll('.video-panel').forEach(panel => observer.observe(panel));
        }

        function pauseAllVideosExcept(activeIndex) {
            videoScrollContainer.querySelectorAll('.video-panel').forEach(panel => {
                const idx = parseInt(panel.getAttribute('data-index'));
                if (idx !== activeIndex) {
                    const videoEl = panel.querySelector('video');
                    if (videoEl && !videoEl.paused) videoEl.pause();
                }
            });
        }

        function playVideoAtIndex(index) {
            const panels = videoScrollContainer.querySelectorAll('.video-panel');
            const targetPanel = panels[index];
            if (targetPanel) {
                const videoEl = targetPanel.querySelector('video');
                if (videoEl) {
                    videoEl.play().catch(() => {});
                    currentVideoIndex = index;
                    pauseAllVideosExcept(index);
                }
            }
        }

        function preloadAdjacentVideos(currentIndex) {
            const panels = videoScrollContainer.querySelectorAll('.video-panel');
            [currentIndex+1, currentIndex-1].forEach(idx => {
                if (idx >= 0 && idx < panels.length) {
                    const videoEl = panels[idx].querySelector('video');
                    if (videoEl && videoEl.getAttribute('preload') !== 'auto') {
                        videoEl.setAttribute('preload', 'auto');
                        videoEl.load();
                    }
                }
            });
        }

        // ==================== 分类切换 ====================
        function switchCategory(category) {
            if (activeCategory === category) return;
            activeCategory = category;
            renderTabs();
            filterVideosByCategory();
            videoScrollContainer.innerHTML = '';
            if (filteredVideos.length === 0) {
                videoScrollContainer.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;color:rgba(255,255,255,0.5);"><span style="font-size:48px;">📂</span><span style="font-size:15px;">该分区暂无视频</span></div>`;
                return;
            }
            filteredVideos.forEach((video, index) => {
                videoScrollContainer.appendChild(createVideoPanel(video, index));
            });
            videoElements = Array.from(videoScrollContainer.querySelectorAll('.video-panel video'));
            setupIntersectionObserver();
            videoScrollContainer.scrollTop = 0;
            currentVideoIndex = 0;
            setTimeout(() => playVideoAtIndex(0), 300);
        }

        // ==================== 键盘控制 ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'j') {
                e.preventDefault();
                const panels = videoScrollContainer.querySelectorAll('.video-panel');
                if (currentVideoIndex < panels.length-1) panels[currentVideoIndex+1].scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
                e.preventDefault();
                const panels = videoScrollContainer.querySelectorAll('.video-panel');
                if (currentVideoIndex > 0) panels[currentVideoIndex-1].scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (e.key === ' ') {
                e.preventDefault();
                const panels = videoScrollContainer.querySelectorAll('.video-panel');
                if (panels[currentVideoIndex]) {
                    const videoEl = panels[currentVideoIndex].querySelector('video');
                    const playOverlay = panels[currentVideoIndex].querySelector('.play-overlay');
                    if (videoEl) togglePlayPause(videoEl, playOverlay);
                }
            }
        });

        // ==================== 状态覆盖层 ====================
        function showLoadingState() {
            loadingOverlay.classList.remove('hidden');
            errorOverlay.classList.add('hidden');
            emptyOverlay.classList.add('hidden');
        }
        function showErrorState(message) {
            loadingOverlay.classList.add('hidden');
            errorOverlay.classList.remove('hidden');
            emptyOverlay.classList.add('hidden');
            errorMessage.textContent = message || '无法获取视频列表，请检查网络或仓库设置。';
        }
        function showEmptyState() {
            loadingOverlay.classList.add('hidden');
            errorOverlay.classList.add('hidden');
            emptyOverlay.classList.remove('hidden');
        }
        function hideAllOverlays() {
            loadingOverlay.classList.add('hidden');
            errorOverlay.classList.add('hidden');
            emptyOverlay.classList.add('hidden');
        }

        // ==================== 初始化 ====================
        async function init() {
            showLoadingState();
            likedVideos = getLikedFromStorage();
            try {
                await loadAllVideos();
            } catch (err) {
                console.error('加载视频列表失败:', err);
                showErrorState(err.message);
                return;
            }
            if (allVideos.length === 0) {
                showEmptyState();
                renderTabs();
                return;
            }
            hideAllOverlays();
            renderTabs();
            renderVideoList();
            // ✅ 默认声音已开启，无静音按钮
        }

        retryBtn.addEventListener('click', () => {
            sessionStorage.removeItem(getCacheKey());
            init();
        });
        refreshBtn.addEventListener('click', () => {
            sessionStorage.removeItem(getCacheKey());
            init();
        });

        window.addEventListener('resize', () => {
            clearTimeout(window._resizeDebounce);
            window._resizeDebounce = setTimeout(() => {
                const panels = videoScrollContainer.querySelectorAll('.video-panel');
                if (panels[currentVideoIndex]) panels[currentVideoIndex].scrollIntoView({ behavior: 'instant', block: 'start' });
            }, 300);
        });

        document.addEventListener('gesturestart', () => {}, { passive: true });

        init();

        console.log('🎬 DPMHZX 视频流已就绪（默认有声）');
    })();
</script>
</body>
</html>
