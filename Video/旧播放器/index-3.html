<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GitHub 短视频流 | 沉浸式滑动体验</title>
    <!-- 简洁大气字体 + 图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 避免滑动时选中文字 */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100%;
            position: fixed;
        }

        /* 主容器：滑动区域 */
        .video-stream {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; /* 隐藏滚动条保持干净 */
        }
        .video-stream::-webkit-scrollbar {
            display: none;
        }

        /* 每个视频卡片 */
        .video-card {
            scroll-snap-align: start;
            height: 100vh;
            width: 100%;
            position: relative;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;      /* 类似抖音，充满屏幕，可能裁切边缘 */
            background: black;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 渐变遮罩 - 保证文字可读 */
        .video-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* 右侧互动栏 （极简风格，只保留必要元素）*/
        .right-sidebar {
            position: absolute;
            bottom: 28%;
            right: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            z-index: 10;
        }
        .action-btn {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s ease;
            border: 0.5px solid rgba(255,255,255,0.2);
        }
        .action-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.2);
        }

        /* 底部视频信息 */
        .video-info {
            position: absolute;
            bottom: 18px;
            left: 16px;
            right: 80px;
            z-index: 10;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
            pointer-events: none;
        }
        .video-title {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .video-title i {
            font-size: 0.8rem;
            opacity: 0.8;
        }
        .video-meta {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 4px;
            display: flex;
            gap: 12px;
        }

        /* 顶部栏 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 18px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            color: white;
            pointer-events: none;
        }
        .top-bar-left {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .top-bar-left span {
            font-weight: 600;
            font-size: 1rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            padding: 6px 14px;
            border-radius: 40px;
        }
        .refresh-btn {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
        }
        .refresh-btn:active {
            opacity: 0.7;
        }
        .counter {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            pointer-events: auto;
        }

        /* 加载遮罩 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            gap: 16px;
            transition: opacity 0.3s;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-toast {
            position: fixed;
            bottom: 100px;
            left: 16px;
            right: 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 12px 20px;
            color: #ffb347;
            font-size: 0.85rem;
            text-align: center;
            z-index: 50;
            transform: translateY(100px);
            transition: 0.2s;
            pointer-events: none;
        }
        .error-toast.show {
            transform: translateY(0);
        }
        .volume-badge {
            font-size: 0.7rem;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 2px 8px;
            margin-left: 6px;
        }
        /* 失败占位符 */
        .video-error-placeholder {
            position: absolute;
            color: #ccc;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 10;
            backdrop-filter: blur(8px);
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-weight: 500;">正在加载短视频流...</div>
    <div style="font-size: 0.7rem; opacity: 0.6;">从 GitHub 仓库获取视频</div>
</div>

<div class="top-bar">
    <div class="top-bar-left">
        <span><i class="fab fa-github"></i> spacedls/dpmhzx</span>
        <div class="refresh-btn" id="refreshStreamBtn">
            <i class="fas fa-sync-alt"></i> 刷新
        </div>
    </div>
    <div class="counter" id="videoCounter">
        0 / 0
    </div>
</div>

<div class="video-stream" id="videoStream"></div>

<!-- 错误提示浮层 -->
<div id="errorToast" class="error-toast"></div>

<script>
    // ---------- 固定仓库配置 ----------
    const GITHUB_OWNER = "spacedls";
    const GITHUB_REPO = "dpmhzx";
    const GITHUB_BRANCH = "main";
    const VIDEO_DIR = "Video";          // 视频目录
    
    // 全局状态
    let videoItems = [];                // 存储每个card的DOM元素和video元素
    let currentVideoIndex = -1;         // 当前正在播放的视频索引（基于视口）
    let intersectionObserver = null;
    let isLoading = false;
    let videoListData = [];              // 存储原始视频信息 { name, path }
    let streamContainer = document.getElementById('videoStream');
    let loadingOverlay = document.getElementById('loadingOverlay');
    let errorToast = document.getElementById('errorToast');
    let videoCounterSpan = document.getElementById('videoCounter');
    
    // 辅助函数：显示短暂提示
    function showToast(msg, isError = true) {
        errorToast.innerText = msg;
        errorToast.classList.add('show');
        setTimeout(() => {
            errorToast.classList.remove('show');
        }, 2800);
    }
    
    // 格式化文件大小（仅展示用）
    function formatFileSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + 'B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
        return (bytes / 1048576).toFixed(1) + 'MB';
    }
    
    // 构建原始视频直链 (raw.githubusercontent.com 支持播放)
    function buildVideoRawUrl(owner, repo, branch, filePath) {
        let cleanPath = filePath.startsWith('/') ? filePath.slice(1) : filePath;
        // 注意: 路径中空格或特殊字符需要进行编码
        const encodedPath = cleanPath.split('/').map(part => encodeURIComponent(part)).join('/');
        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${encodedPath}`;
    }
    
    // 从 GitHub API 获取视频列表
    async function fetchVideoList() {
        const apiPath = VIDEO_DIR ? VIDEO_DIR : '';
        let apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${apiPath}?ref=${GITHUB_BRANCH}`;
        if (!apiPath) {
            apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents?ref=${GITHUB_BRANCH}`;
        }
        
        const response = await fetch(apiUrl);
        if (!response.ok) {
            if (response.status === 404) throw new Error(`仓库路径不存在: "${VIDEO_DIR}" 目录未找到，请检查仓库 spacedls/dpmhzx 下是否存在该目录`);
            if (response.status === 403) throw new Error(`GitHub API 限制，请稍后重试或确保仓库公开`);
            throw new Error(`获取失败 (${response.status})`);
        }
        const data = await response.json();
        if (!Array.isArray(data)) {
            throw new Error(`"${VIDEO_DIR}" 不是有效的目录`);
        }
        // 过滤视频文件 (支持 mp4, webm, mov, m4v)
        const videoExtensions = ['.mp4', '.webm', '.mov', '.m4v'];
        const videoFiles = data.filter(item => {
            if (item.type !== 'file') return false;
            const ext = item.name.substring(item.name.lastIndexOf('.')).toLowerCase();
            return videoExtensions.includes(ext);
        });
        
        return videoFiles.map(file => ({
            name: file.name,
            path: file.path,
            size: file.size
        }));
    }
    
    // 暂停所有视频
    function pauseAllVideos() {
        videoItems.forEach(item => {
            if (item.video && !item.video.paused) {
                item.video.pause();
            }
        });
    }
    
    // 播放指定索引的视频 (并确保其他暂停)
    async function playVideoAtIndex(index) {
        if (index < 0 || index >= videoItems.length) return;
        const target = videoItems[index];
        if (!target || !target.video) return;
        
        // 如果当前就是这个视频并且已经在播放，不再重复处理
        if (currentVideoIndex === index && target.video && !target.video.paused) return;
        
        // 暂停其它
        pauseAllVideos();
        
        // 尝试播放新视频
        try {
            // 如果视频出错或者未加载完成，加载重试
            if (target.video.readyState < 2 && target.video.src) {
                // 等待 canplay
                await new Promise((resolve) => {
                    const onCanPlay = () => {
                        target.video.removeEventListener('canplay', onCanPlay);
                        resolve();
                    };
                    target.video.addEventListener('canplay', onCanPlay, { once: true });
                    target.video.load();
                    setTimeout(resolve, 1500); // 超时保护
                });
            }
            // 静音属性保持界面一致（避免自动播放策略，但在用户主动交互之前都是静音，但为了体验默认所有视频静音）
            // 由用户点击音量按钮决定是否全局取消静音
            target.video.muted = target.video.dataset.userMuted === 'false' ? false : true;
            await target.video.play();
            currentVideoIndex = index;
            updateCounterUI(index);
        } catch (err) {
            console.warn(`视频 ${index} 自动播放失败:`, err);
            // 如果播放失败可能是因为未交互，但已经静音也失败? 显示提示
            if (err.name === 'NotAllowedError') {
                showToast("点击屏幕任意处可开启声音并播放", false);
            } else {
                // 视频加载错误特殊处理：在卡片上显示重试按钮？简化显示错误提醒
                if (!target.errorDisplayed) {
                    target.errorDisplayed = true;
                    showToast(`视频 "${videoListData[index]?.name}" 加载失败，可尝试刷新`, true);
                }
            }
        }
        currentVideoIndex = index;
        updateCounterUI(index);
    }
    
    // 更新顶部计数器
    function updateCounterUI(index) {
        if (videoListData.length) {
            videoCounterSpan.innerText = `${index+1} / ${videoListData.length}`;
        } else {
            videoCounterSpan.innerText = `0 / 0`;
        }
    }
    
    // 创建单个视频卡片 DOM
    function createVideoCard(videoInfo, idx) {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.setAttribute('data-index', idx);
        
        // video 元素
        const videoElem = document.createElement('video');
        const rawUrl = buildVideoRawUrl(GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH, videoInfo.path);
        videoElem.src = rawUrl;
        videoElem.preload = 'metadata';
        videoElem.playsInline = true;
        videoElem.muted = true;       // 默认静音，遵守浏览器自动播放策略
        videoElem.loop = false;       // 抖音风格一般非循环，滑动切换
        videoElem.setAttribute('disablePictureInPicture', 'true');
        
        // 错误处理: 加载失败展示占位提示
        videoElem.onerror = (e) => {
            console.error(`视频加载失败: ${videoInfo.name}`, e);
            const errPlaceholder = document.createElement('div');
            errPlaceholder.className = 'video-error-placeholder';
            errPlaceholder.innerHTML = '<i class="fas fa-exclamation-triangle"></i> 视频无法播放，可尝试刷新';
            if (!card.querySelector('.video-error-placeholder')) {
                card.appendChild(errPlaceholder);
                setTimeout(() => errPlaceholder.remove(), 3000);
            }
            // 显示错误提示但不影响滑动流
        };
        
        card.appendChild(videoElem);
        
        // 渐变层 & UI 元素
        const gradient = document.createElement('div');
        gradient.className = 'video-gradient';
        card.appendChild(gradient);
        
        // 右侧交互栏 (静音/声音 + 简单标识)
        const rightSidebar = document.createElement('div');
        rightSidebar.className = 'right-sidebar';
        
        const soundBtn = document.createElement('div');
        soundBtn.className = 'action-btn';
        soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // 切换当前视频的静音状态
            if (videoElem.muted) {
                videoElem.muted = false;
                soundBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                videoElem.dataset.userMuted = 'false';
                // 如果当前视频因为自动播放策略暂停，尝试播放
                if (videoElem.paused) {
                    videoElem.play().catch(err => console.log("play error", err));
                }
            } else {
                videoElem.muted = true;
                soundBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                videoElem.dataset.userMuted = 'true';
            }
        });
        
        // 可以添加一个简单“喜欢”占位，但保持简洁
        const likeDummy = document.createElement('div');
        likeDummy.className = 'action-btn';
        likeDummy.innerHTML = '<i class="far fa-heart"></i>';
        likeDummy.addEventListener('click', (e) => {
            e.stopPropagation();
            likeDummy.innerHTML = '<i class="fas fa-heart" style="color:#ff5b7a;"></i>';
            setTimeout(() => {
                if(likeDummy.innerHTML.includes('fa-heart')) likeDummy.innerHTML = '<i class="far fa-heart"></i>';
            }, 500);
            showToast("❤️ 喜欢（演示交互）", false);
        });
        
        rightSidebar.appendChild(soundBtn);
        rightSidebar.appendChild(likeDummy);
        card.appendChild(rightSidebar);
        
        // 底部视频信息
        const infoDiv = document.createElement('div');
        infoDiv.className = 'video-info';
        const titleDiv = document.createElement('div');
        titleDiv.className = 'video-title';
        titleDiv.innerHTML = `<i class="fab fa-github"></i> ${escapeHtml(videoInfo.name)}`;
        const metaDiv = document.createElement('div');
        metaDiv.className = 'video-meta';
        const sizeText = videoInfo.size ? formatFileSize(videoInfo.size) : '';
        metaDiv.innerHTML = `<span><i class="far fa-clock"></i> 短视频流</span> ${sizeText ? `<span>${sizeText}</span>` : ''}`;
        infoDiv.appendChild(titleDiv);
        infoDiv.appendChild(metaDiv);
        card.appendChild(infoDiv);
        
        // 存储video引用
        return { card, video: videoElem };
    }
    
    // 渲染全部视频流（销毁现有重建）
    async function buildStream(videos) {
        streamContainer.innerHTML = '';
        videoItems = [];
        videoListData = videos;
        
        if (!videos.length) {
            streamContainer.innerHTML = `<div style="height:100vh; display:flex; align-items:center; justify-content:center; color:white; background:black; flex-direction:column;">
                <i class="fas fa-folder-open" style="font-size:48px; margin-bottom:16px; opacity:0.6;"></i>
                <p>📭 未找到视频文件</p>
                <p style="font-size:12px; margin-top:8px;">请确认 spacedls/dpmhzx/Video 目录下存在 mp4/webm/mov 视频</p>
            </div>`;
            videoCounterSpan.innerText = `0 / 0`;
            return false;
        }
        
        // 为每个视频创建卡片并追加
        for (let i = 0; i < videos.length; i++) {
            const { card, video } = createVideoCard(videos[i], i);
            streamContainer.appendChild(card);
            videoItems.push({ card, video, index: i });
        }
        
        videoCounterSpan.innerText = `1 / ${videos.length}`;
        return true;
    }
    
    // 利用 Intersection Observer 检测当前播放哪个视频 (基于视口中心或可见比例>0.6)
    function initIntersectionObserver() {
        if (intersectionObserver) intersectionObserver.disconnect();
        
        const options = {
            threshold: 0.55,      // 可见比例超过55%才认为是当前视频
            root: null,
            rootMargin: "0px"
        };
        
        intersectionObserver = new IntersectionObserver((entries) => {
            // 找到可见比例最高的元素
            let maxRatio = 0;
            let targetIndex = -1;
            for (const entry of entries) {
                if (entry.intersectionRatio > maxRatio) {
                    maxRatio = entry.intersectionRatio;
                    const idxAttr = entry.target.getAttribute('data-index');
                    if (idxAttr !== null) targetIndex = parseInt(idxAttr, 10);
                }
            }
            if (targetIndex !== -1 && targetIndex !== currentVideoIndex && maxRatio > 0.5) {
                // 切换播放
                playVideoAtIndex(targetIndex);
            } else if (targetIndex === -1 && currentVideoIndex !== -1 && videoItems[currentVideoIndex] && videoItems[currentVideoIndex].video && !videoItems[currentVideoIndex].video.paused) {
                // 兜底：如果完全滑出并且没有任何高可见视频，暂停当前
                if (maxRatio === 0) {
                    videoItems[currentVideoIndex]?.video?.pause();
                }
            }
        }, options);
        
        // 观察所有卡片
        videoItems.forEach(item => {
            if (item.card) intersectionObserver.observe(item.card);
        });
    }
    
    // 刷新整个视频流 (重新拉取github)
    async function refreshStream() {
        if (isLoading) return;
        isLoading = true;
        loadingOverlay.style.display = 'flex';
        try {
            const videoFiles = await fetchVideoList();
            if (videoFiles.length === 0) {
                showToast("未找到任何视频，请检查仓库目录", true);
                streamContainer.innerHTML = `<div style="height:100vh; display:flex; align-items:center; justify-content:center; color:white; background:black; flex-direction:column;">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px;"></i>
                    <p>暂无视频文件</p>
                    <p style="font-size:12px">确保 spacedls/dpmhzx/Video 目录有 mp4</p>
                </div>`;
                videoCounterSpan.innerText = `0 / 0`;
                loadingOverlay.style.display = 'none';
                isLoading = false;
                return;
            }
            await buildStream(videoFiles);
            initIntersectionObserver();
            currentVideoIndex = -1;
            // 默认滚动到第一个视频，并尝试播放
            if (videoItems.length > 0) {
                // 滚动至顶部
                streamContainer.scrollTo({ top: 0, behavior: 'auto' });
                setTimeout(() => {
                    playVideoAtIndex(0);
                }, 200);
            }
        } catch (err) {
            console.error(err);
            let errMsg = err.message || "加载视频库失败，检查网络/仓库";
            showToast(errMsg, true);
            streamContainer.innerHTML = `<div style="height:100vh; display:flex; align-items:center; justify-content:center; color:white; background:black; flex-direction:column;">
                <i class="fas fa-wifi" style="font-size:48px; margin-bottom:16px;"></i>
                <p>加载失败: ${escapeHtml(errMsg)}</p>
                <button id="retryLoadBtn" style="margin-top:20px; background:rgba(255,255,255,0.2); border:none; padding:8px 20px; border-radius:30px; color:white; cursor:pointer;">重试</button>
            </div>`;
            const retryBtn = document.getElementById('retryLoadBtn');
            if (retryBtn) retryBtn.onclick = () => refreshStream();
            videoCounterSpan.innerText = `0 / 0`;
        } finally {
            loadingOverlay.style.display = 'none';
            isLoading = false;
        }
    }
    
    // 辅助防抖 / 处理滑动过程中频繁触发播放切换优化
    let scrollTimeout;
    function onScrollEnd() {
        if (scrollTimeout) clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(() => {
            // 滚动结束后再触发一次observer强检 (确保最终视频正确)
            if (videoItems.length) {
                const containerRect = streamContainer.getBoundingClientRect();
                let bestIndex = -1;
                let bestRatio = 0;
                videoItems.forEach((item, idx) => {
                    const rect = item.card.getBoundingClientRect();
                    const visibleHeight = Math.min(rect.bottom, containerRect.bottom) - Math.max(rect.top, containerRect.top);
                    const ratio = visibleHeight / rect.height;
                    if (ratio > bestRatio && ratio > 0.4) {
                        bestRatio = ratio;
                        bestIndex = idx;
                    }
                });
                if (bestIndex !== -1 && bestIndex !== currentVideoIndex) {
                    playVideoAtIndex(bestIndex);
                } else if (bestIndex === -1 && currentVideoIndex !== -1) {
                    // 以防万一
                    if (videoItems[currentVideoIndex] && videoItems[currentVideoIndex].video && !videoItems[currentVideoIndex].video.paused) {
                        // 暂停非可视区域
                        const curRect = videoItems[currentVideoIndex].card.getBoundingClientRect();
                        if (curRect.bottom < 0 || curRect.top > window.innerHeight) {
                            videoItems[currentVideoIndex].video.pause();
                        }
                    }
                }
            }
        }, 80);
    }
    
    // 初始化和事件绑定
    async function init() {
        // 监听滚动结束（优化性能）
        streamContainer.addEventListener('scroll', () => {
            onScrollEnd();
        });
        // 同样监听touch结束，确保移动端优雅
        let touchEndTimer;
        streamContainer.addEventListener('touchend', () => {
            if (touchEndTimer) clearTimeout(touchEndTimer);
            touchEndTimer = setTimeout(() => {
                onScrollEnd();
            }, 100);
        });
        
        // 刷新按钮
        document.getElementById('refreshStreamBtn').addEventListener('click', () => {
            refreshStream();
        });
        
        // 首次加载
        await refreshStream();
        
        // 全局点击尝试解除静音限制（增强用户交互）
        document.body.addEventListener('click', () => {
            if (videoItems.length && currentVideoIndex !== -1) {
                const curVideo = videoItems[currentVideoIndex]?.video;
                if (curVideo && curVideo.muted && curVideo.paused) {
                    // 尝试播放当前视频（用户主动交互）
                    curVideo.muted = false;
                    curVideo.play().catch(e => console.log);
                    // 更新声音按钮图标: 找到当前卡片右侧的声音按钮并更新样式
                    const activeCard = videoItems[currentVideoIndex]?.card;
                    if (activeCard) {
                        const soundIcon = activeCard.querySelector('.action-btn:first-child i');
                        if (soundIcon) {
                            soundIcon.className = 'fas fa-volume-up';
                            curVideo.dataset.userMuted = 'false';
                        }
                    }
                }
            }
        });
    }
    
    // 工具函数
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // 启动
    init();
</script>
