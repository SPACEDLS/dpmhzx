<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GitHub 影库 | 极简视频播放器</title>
    <!-- 字体与图标库，保持简洁大气 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f6fafd;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1a2c3e;
            padding: 2rem 1.5rem;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部简洁 */
        .header {
            margin-bottom: 2rem;
            text-align: left;
        }
        .header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e2f3f, #2c4c6c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
        .header p {
            color: #5b7c9c;
            margin-top: 0.5rem;
            font-weight: 400;
            font-size: 0.95rem;
        }
        .repo-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #eef2f8;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-top: 0.75rem;
            backdrop-filter: blur(2px);
            border: 1px solid #e2edf4;
        }
        .repo-badge i {
            color: #2c4c6c;
        }
        .refresh-btn {
            background: none;
            border: none;
            margin-left: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #5482a0;
            transition: 0.2s;
            padding: 0 6px;
            border-radius: 30px;
        }
        .refresh-btn:hover {
            color: #1a2c3e;
            background: #e6edf4;
            transform: rotate(15deg);
        }

        /* 双分区布局 */
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.8rem;
        }

        /* 播放器区域 */
        .player-section {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            transition: all 0.2s;
            border: 1px solid #e9f0f5;
        }
        .video-wrapper {
            background: #0e171f;
            position: relative;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #0a1016;
            display: block;
        }
        .player-info {
            padding: 1.2rem 1.5rem;
            border-top: 1px solid #f0f5fa;
        }
        .player-info h3 {
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e2f3f;
        }
        .player-info p {
            color: #6f8eac;
            font-size: 0.8rem;
            margin-top: 0.4rem;
            word-break: break-all;
        }
        .empty-player-message {
            padding: 2rem;
            text-align: center;
            color: #96afca;
        }

        /* 右侧视频库分区 */
        .library-section {
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9f0f5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: fit-content;
            max-height: 70vh;
        }
        .library-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #eff4fa;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }
        .library-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .video-count {
            background: #eef2f8;
            padding: 0.2rem 0.65rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c4c6c;
        }
        .video-list {
            list-style: none;
            overflow-y: auto;
            padding: 0.4rem 0;
            flex: 1;
        }
        .video-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.5rem;
            margin: 0.2rem 0;
            cursor: pointer;
            transition: all 0.15s ease;
            border-left: 3px solid transparent;
        }
        .video-item:hover {
            background: #f8fbfe;
        }
        .video-item.active {
            background: #eff6fe;
            border-left-color: #3c7eb0;
        }
        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }
        .video-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a2c3e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .video-meta {
            font-size: 0.7rem;
            color: #88a2c0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .play-icon {
            color: #7b9cbd;
            font-size: 1rem;
            opacity: 0.7;
            transition: 0.2s;
        }
        .video-item:hover .play-icon {
            opacity: 1;
            color: #2c4c6c;
        }
        .empty-list {
            padding: 2rem 1.5rem;
            text-align: center;
            color: #a4bbd4;
            font-size: 0.85rem;
        }
        .loader {
            display: flex;
            justify-content: center;
            padding: 2rem;
        }
        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid #e2ecf5;
            border-top-color: #2c4c6c;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            color: #bc5a3c;
            background: #fff4ef;
            padding: 0.8rem 1rem;
            border-radius: 24px;
            font-size: 0.8rem;
            margin: 1rem;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        /* 滚动条 */
        .video-list::-webkit-scrollbar {
            width: 5px;
        }
        .video-list::-webkit-scrollbar-track {
            background: #f0f5fc;
            border-radius: 10px;
        }
        .video-list::-webkit-scrollbar-thumb {
            background: #cbdbe2;
            border-radius: 10px;
        }
        footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #98afca;
            border-top: 1px solid #e9f0f8;
            padding-top: 1.5rem;
        }
        @media (max-width: 780px) {
            body {
                padding: 1rem;
            }
            .two-columns {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .library-section {
                max-height: 460px;
            }
        }
        .info-tip {
            font-size: 0.7rem;
            background: #f2f7fc;
            border-radius: 16px;
            padding: 0.2rem 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-film" style="margin-right: 12px; color: #2c5a7a;"></i>GitHub 影库 · 静帧剧场</h1>
        <p>直接从 GitHub 仓库加载视频，简洁分区，无需配置，即点即播</p>
        <div class="repo-badge">
            <i class="fab fa-github"></i> spacedls / dpmhzx 
            <span style="margin:0 4px">•</span> 
            <i class="fas fa-code-branch"></i> main 
            <span style="margin:0 4px">•</span> 
            <i class="fas fa-folder-open"></i> Video 
            <button id="refreshLibraryBtn" class="refresh-btn" title="重新加载视频库"><i class="fas fa-sync-alt"></i></button>
        </div>
    </div>

    <!-- 双分区布局：播放区 + 视频库区 -->
    <div class="two-columns">
        <!-- 左侧播放器区域 -->
        <div class="player-section">
            <div class="video-wrapper">
                <video id="mainVideo" controls preload="metadata" poster="">
                    <source src="" type="video/mp4">
                    您的浏览器不支持 video 标签。
                </video>
            </div>
            <div class="player-info" id="playerInfo">
                <h3><i class="fas fa-play-circle"></i> <span id="currentVideoTitle">等待选择影片</span></h3>
                <p id="currentVideoPath">✨ 从右侧视频库点击任意视频开始播放</p>
            </div>
        </div>

        <!-- 右侧 LIBRARY 分区（视频列表） -->
        <div class="library-section">
            <div class="library-header">
                <h2><i class="fas fa-video"></i> 视频分区 <span class="video-count" id="videoCount">--</span></h2>
                <div class="info-tip"><i class="fas fa-database"></i> GitHub 源</div>
            </div>
            <div id="videoListContainer" class="video-list">
                <div class="loader"><div class="spinner"></div><div style="margin-left: 12px;">正在连接影库...</div></div>
            </div>
        </div>
    </div>
    <footer>
        <i class="fab fa-github"></i> 视频源于 spacedls/dpmhzx 仓库 /Video 目录 · 支持 mp4/webm/mov · 优雅播放
    </footer>
</div>

<script>
    // ----------------------------- 固定配置 -----------------------------
    const GITHUB_OWNER = "spacedls";
    const GITHUB_REPO = "dpmhzx";
    const GITHUB_BRANCH = "main";
    const VIDEO_DIR = "Video";    // 视频目录
    
    // DOM 元素
    const mainVideo = document.getElementById('mainVideo');
    const currentVideoTitleSpan = document.getElementById('currentVideoTitle');
    const currentVideoPathSpan = document.getElementById('currentVideoPath');
    const videoListContainer = document.getElementById('videoListContainer');
    const videoCountSpan = document.getElementById('videoCount');
    const refreshBtn = document.getElementById('refreshLibraryBtn');
    
    // 存储当前视频列表数据 (用于刷新等)
    let currentVideoList = [];
    
    // 辅助: 格式化文件大小
    function formatFileSize(bytes) {
        if (!bytes && bytes !== 0) return '未知大小';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }
    
    // 视频扩展名白名单
    const videoExtensions = ['.mp4', '.webm', '.mov', '.m4v', '.mkv'];
    function isVideoFile(filename) {
        const ext = filename.substring(filename.lastIndexOf('.')).toLowerCase();
        return videoExtensions.includes(ext);
    }
    
    // 构建 jsDelivr CDN 链接 (加速播放，支持range请求)
    function buildCdnUrl(owner, repo, branch, filePath) {
        let cleanPath = filePath.startsWith('/') ? filePath.slice(1) : filePath;
        // 对路径进行编码，保证特殊字符正确
        const encodedPath = cleanPath.split('/').map(part => encodeURIComponent(part)).join('/');
        return `https://cdn.jsdelivr.net/gh/${owner}/${repo}@${branch}/${encodedPath}`;
    }
    
    // 从 GitHub API 获取指定目录下的文件列表
    async function fetchVideoFilesFromGitHub(owner, repo, branch, folderPath) {
        let apiPath = folderPath.trim();
        if (apiPath.startsWith('/')) apiPath = apiPath.slice(1);
        // 构建API URL，注意如果目录为空字符串则请求仓库根目录
        let apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${apiPath}?ref=${branch}`;
        if (!apiPath) {
            apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`;
        }
        
        const response = await fetch(apiUrl);
        if (!response.ok) {
            if (response.status === 404) {
                throw new Error(`仓库路径未找到: 请确保目录 "${folderPath}" 存在于 ${owner}/${repo}:${branch} 中，且仓库公开`);
            }
            if (response.status === 403) {
                throw new Error(`API 访问受限，请稍后重试或确认仓库公开`);
            }
            throw new Error(`请求失败 (${response.status})`);
        }
        const data = await response.json();
        if (!Array.isArray(data)) {
            throw new Error(`路径 "${folderPath}" 不是一个目录，请检查视频目录配置`);
        }
        // 过滤视频文件
        const videoFiles = data.filter(item => item.type === 'file' && isVideoFile(item.name));
        const videos = videoFiles.map(file => ({
            name: file.name,
            path: file.path,           // 仓库相对路径
            size: file.size,
            downloadUrl: file.download_url
        }));
        return videos;
    }
    
    // 渲染视频列表 (右侧分区)
    function renderVideoList(videos) {
        if (!videos || videos.length === 0) {
            videoListContainer.innerHTML = `
                <div class="empty-list">
                    <i class="fas fa-folder-open" style="font-size: 32px; opacity: 0.4; margin-bottom: 12px; display: block;"></i>
                    🎬 当前视频目录没有找到视频文件<br>
                    请确认 spacedls/dpmhzx 仓库的 /Video 目录下存在 mp4 / webm / mov 格式视频
                </div>
            `;
            videoCountSpan.innerText = '0';
            return;
        }
        
        videoCountSpan.innerText = videos.length;
        const listHtml = videos.map((video, idx) => {
            const sizeStr = formatFileSize(video.size);
            const cdnSrc = buildCdnUrl(GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH, video.path);
            // 转义名称
            const safeName = escapeHtml(video.name);
            const safePath = escapeHtml(video.path);
            return `
                <li class="video-item" data-video-src="${escapeAttr(cdnSrc)}" data-video-name="${safeName}" data-video-path="${safePath}">
                    <div class="video-info">
                        <div class="video-name">${safeName}</div>
                        <div class="video-meta"><i class="far fa-file-video"></i> ${sizeStr}</div>
                    </div>
                    <div class="play-icon"><i class="fas fa-play"></i></div>
                </li>
            `;
        }).join('');
        
        videoListContainer.innerHTML = `<ul style="list-style: none; margin:0; padding:0;">${listHtml}</ul>`;
        
        // 绑定点击播放事件
        const items = document.querySelectorAll('.video-item');
        items.forEach(item => {
            item.addEventListener('click', (e) => {
                // 高亮当前选中项
                document.querySelectorAll('.video-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const videoSrc = item.getAttribute('data-video-src');
                const videoName = item.getAttribute('data-video-name');
                const videoPath = item.getAttribute('data-video-path');
                if (videoSrc) {
                    playSelectedVideo(videoSrc, videoName, videoPath);
                }
            });
        });
    }
    
    // 安全转义 (防XSS)
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function escapeAttr(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    
    // 播放视频
    async function playSelectedVideo(src, videoName, videoPath) {
        if (!src) return;
        currentVideoTitleSpan.innerText = videoName || '正在播放';
        currentVideoPathSpan.innerText = `📁 ${videoPath || '仓库视频'}`;
        
        // 切换视频源
        const wasPlaying = !mainVideo.paused;
        mainVideo.src = src;
        mainVideo.load();
        // 尝试自动播放 (由于用户点击触发，一般可自动播放)
        try {
            await mainVideo.play();
        } catch (err) {
            console.warn('自动播放被浏览器阻止，请手动点击播放按钮', err);
            // 静默失败，用户可手动点击视频播放按钮
        }
    }
    
    // 显示加载错误信息
    function showError(message) {
        videoListContainer.innerHTML = `
            <div class="error-msg">
                <i class="fas fa-exclamation-triangle"></i> 
                <span>${escapeHtml(message)}</span>
            </div>
            <div class="empty-list" style="padding-top:0;">
                <i class="fas fa-redo-alt"></i> 点击上方刷新按钮重试
            </div>
        `;
        videoCountSpan.innerText = '0';
        currentVideoTitleSpan.innerText = '加载失败';
        currentVideoPathSpan.innerText = '⚠️ 无法连接影库，请检查网络或仓库权限';
    }
    
    // 显示加载状态
    function setLoadingState() {
        videoListContainer.innerHTML = `<div class="loader"><div class="spinner"></div><div style="margin-left: 12px;">加载视频库中...</div></div>`;
        videoCountSpan.innerText = '...';
    }
    
    // 核心加载流程: 调用 GitHub API 获取视频列表并渲染
    async function loadVideoLibrary() {
        setLoadingState();
        try {
            const videos = await fetchVideoFilesFromGitHub(GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH, VIDEO_DIR);
            currentVideoList = videos;
            renderVideoList(videos);
            // 如果有视频，默认自动选中第一个并展示在播放器信息区域，但不自动播放 (尊重用户选择)
            if (videos.length > 0) {
                const firstVideo = videos[0];
                const firstCdnSrc = buildCdnUrl(GITHUB_OWNER, GITHUB_REPO, GITHUB_BRANCH, firstVideo.path);
                // 仅仅预显示第一个视频信息，不播放；但高亮列表第一项
                setTimeout(() => {
                    const firstItem = document.querySelector('.video-item');
                    if (firstItem && !document.querySelector('.video-item.active')) {
                        // 不高亮自动播放，只显示提示到播放器描述区
                        currentVideoTitleSpan.innerText = `📀 ${firstVideo.name}`;
                        currentVideoPathSpan.innerText = `✨ 点击右侧播放按钮观看`;
                    }
                }, 50);
            } else {
                // 无视频时的提示
                currentVideoTitleSpan.innerText = '暂无视频';
                currentVideoPathSpan.innerText = '仓库目录中没有找到视频文件，请上传 mp4/webm/mov 文件';
            }
        } catch (err) {
            console.error(err);
            let errorMessage = err.message || '未知错误，请检查仓库是否公开';
            if (errorMessage.includes('API')) errorMessage = 'GitHub API 调用异常，请稍后重试';
            if (errorMessage.includes('404')) errorMessage = `未找到视频目录 “${VIDEO_DIR}”，请确认 spacedls/dpmhzx 仓库下存在该文件夹且包含视频文件。`;
            showError(errorMessage);
        }
    }
    
    // 手动刷新
    function refreshLibrary() {
        loadVideoLibrary();
        // 重置播放器区域的选中状态 (不清除视频，避免干扰)
        const activeItem = document.querySelector('.video-item.active');
        if (activeItem) activeItem.classList.remove('active');
        // 不强制清空当前播放，但刷新后重新加载列表，播放器保留原有视频但为了避免歧义，如果正在播放不清除，但新列表不会自动覆盖播放器src
        // 更好的体验: 不清除当前播放，但用户再次点击新视频即可
        currentVideoTitleSpan.innerText = '刷新影库中...';
        currentVideoPathSpan.innerText = '🔄 更新视频列表，请稍后';
    }
    
    // 页面初始化自动加载
    window.addEventListener('DOMContentLoaded', () => {
        loadVideoLibrary();
    });
    
    // 绑定刷新按钮
    refreshBtn.addEventListener('click', () => {
        refreshLibrary();
    });
    
    // 可选: 优雅处理网络错误重试
    window.addEventListener('online', () => {
        if (currentVideoList.length === 0) {
            loadVideoLibrary();
        }
    });
</script>
</body>
</html>
```
